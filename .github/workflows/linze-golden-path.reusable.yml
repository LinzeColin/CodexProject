# Linze Golden Path — 可复用工作流 (STAGE-13.1 骨架)
# 任何达到「开发完成定义」的可部署项目, 用一个 caller 调用本工作流即可:
# 自动 verify -> (build) -> 触发 Coolify 部署 -> home 跳转链接同步。
# 注意: 生产化前把所有 action 固定到 commit SHA (铁律: 供应链最小信任)。
name: linze-golden-path

on:
  workflow_call:
    inputs:
      service_name:
        description: "服务名 (对应 linze-service.yaml 的 service_id)"
        required: true
        type: string
      coolify_app_uuid:
        description: "Coolify 应用 uuid (由 Coolify API 预建)"
        required: true
        type: string
      home_live_url:
        description: "home 卡片 liveUrl (*.linzezhang.com); 留空则跳过 home 同步"
        required: false
        default: ""
        type: string
      home_name:
        description: "home 卡片显示名"
        required: false
        default: ""
        type: string
      home_category:
        description: "home 卡片分类"
        required: false
        default: "Cloud Service"
        type: string
      home_summary:
        description: "home 卡片一句话简介"
        required: false
        default: ""
        type: string
      home_fallback_url:
        description: "home 卡片回退链接 (通常 GitHub 源)"
        required: false
        default: ""
        type: string
      home_mode:
        description: "home 卡片视觉 mode (voyage/archive/garden)"
        required: false
        default: "voyage"
        type: string
    secrets:
      COOLIFY_BASE_URL:
        description: "Coolify API 基址, 例如 https://server.linzezhang.com"
        required: true
      COOLIFY_API_TOKEN:
        description: "Coolify API token (最小 deploy 权限)"
        required: true
      HOME_SYNC_TOKEN:
        description: "对 LinzeHomeHub 有 contents:write 的 token; 缺失则跳过 home 同步"
        required: false

permissions:
  contents: read

# 同一服务的部署串行, 不互相取消 (Coolify 部署不可并发覆盖)。
concurrency:
  group: golden-path-${{ inputs.service_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # 硬 Gate 1: 明文 Secret 扫描 —— 命中即阻断部署
      # 私钥须匹配完整 PEM 头(带 ----- 包围), 避免把"检测脚本里的模式字符串"误判为泄露
      - name: Secret 扫描 (硬阻断)
        run: |
          set -uo pipefail
          PAT='-----BEGIN (RSA|OPENSSH|DSA|EC|PGP )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|nskey_live_[A-Za-z0-9]{20,}|cfut_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}'
          HITS=$(grep -rInE "$PAT" . \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=dist \
            --exclude='*.lock' --exclude='package-lock.json' --exclude='*.min.js' \
            --exclude='linze-golden-path.reusable.yml' 2>/dev/null | head -20 || true)
          if [ -n "$HITS" ]; then
            echo "::error::检测到疑似明文 Secret, 阻断部署:"; echo "$HITS"; exit 1
          fi
          echo "Secret 扫描通过"

      # 硬 Gate 2: 项目自检 (按语言识别; 有 lint/test/build 就必须过)
      - name: 项目自检
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          set -uo pipefail
          echo "自检 service=$SERVICE_NAME"
          RC=0
          if [ -f package.json ]; then
            echo "-- Node --"
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund || RC=1
            for S in lint test build; do
              if node -e "const s=require('./package.json').scripts||{};process.exit(s['"'"'$S'"'"']?0:1)" 2>/dev/null; then
                echo "运行 npm run $S"; npm run "$S" || RC=1
              else echo "(无 $S 脚本, 跳过)"; fi
            done
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || ls *.py >/dev/null 2>&1; then
            echo "-- Python 语法门 --"
            python3 -m compileall -q . >/dev/null 2>&1 || { echo "::error::Python 语法检查失败"; RC=1; }
          fi
          [ "$RC" -eq 0 ] || { echo "::error::项目自检失败, 阻断部署"; exit 1; }
          echo "项目自检通过"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 触发 Coolify 部署
        id: trigger
        env:
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP: ${{ inputs.coolify_app_uuid }}
        run: |
          set -euo pipefail
          resp=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/deploy?uuid=$APP&force=false")
          echo "$resp"
          UUID=$(printf '%s' "$resp" | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('deployments') or [{}])[0].get('deployment_uuid',''))")
          [ -n "$UUID" ] || { echo "::error::部署未入队"; exit 1; }
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"

      # 硬 Gate 3: 部署必须真成功
      - name: 等待部署完成
        env:
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DUUID: ${{ steps.trigger.outputs.uuid }}
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            ST=$(curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/deployments/$DUUID" 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            echo "[$i] 部署状态: ${ST:-查询中}"
            case "$ST" in
              finished|success) echo "部署成功"; exit 0 ;;
              failed|error|cancelled) echo "::error::部署失败 ($ST)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::部署超时"; exit 1

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ inputs.home_live_url != '' }}
    steps:
      # 硬 Gate 4: 线上冒烟 —— 外部真可达才允许挂 home 链接 (不制造死链)
      - name: 外部健康冒烟
        env:
          URL: ${{ inputs.home_live_url }}
        run: |
          set -uo pipefail
          for i in $(seq 1 15); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" 2>/dev/null || echo 000)
            echo "[$i] $URL -> $CODE"
            case "$CODE" in 2*|3*) echo "冒烟通过"; exit 0 ;; esac
            sleep 15
          done
          echo "::error::线上冒烟失败, 不挂 home 链接"; exit 1

  home-sync:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 仅当提供了 liveUrl 且配置了写 token 时才同步 home
    if: ${{ inputs.home_live_url != '' }}
    steps:
      - name: 取出 Golden Path 工具
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: LinzeColin/CodexProject
          sparse-checkout: GOLDEN_PATH/tools
          sparse-checkout-cone-mode: false
      - name: upsert home.linzezhang.com 跳转卡片
        env:
          GITHUB_TOKEN: ${{ secrets.HOME_SYNC_TOKEN }}
          SERVICE_NAME: ${{ inputs.service_name }}
          HOME_NAME: ${{ inputs.home_name }}
          HOME_CATEGORY: ${{ inputs.home_category }}
          HOME_SUMMARY: ${{ inputs.home_summary }}
          HOME_LIVE_URL: ${{ inputs.home_live_url }}
          HOME_FALLBACK_URL: ${{ inputs.home_fallback_url }}
          HOME_MODE: ${{ inputs.home_mode }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "未配置 HOME_SYNC_TOKEN, 跳过 home 同步 (非致命)"; exit 0
          fi
          python3 GOLDEN_PATH/tools/home_sync.py \
            --id "$SERVICE_NAME" \
            --name "${HOME_NAME:-$SERVICE_NAME}" \
            --category "$HOME_CATEGORY" \
            --summary "$HOME_SUMMARY" \
            --live-url "$HOME_LIVE_URL" \
            --fallback-url "$HOME_FALLBACK_URL" \
            --mode "$HOME_MODE"
