# Linze Golden Path — 可复用工作流 (STAGE-13.1 骨架)
# 任何达到「开发完成定义」的可部署项目, 用一个 caller 调用本工作流即可:
# 自动 verify -> (build) -> 触发 Coolify 部署 -> home 跳转链接同步。
# 注意: 生产化前把所有 action 固定到 commit SHA (铁律: 供应链最小信任)。
name: linze-golden-path

on:
  workflow_call:
    inputs:
      service_name:
        description: "服务名 (对应 linze-service.yaml 的 service_id)"
        required: true
        type: string
      coolify_app_uuid:
        description: "Coolify 应用 uuid (由 Coolify API 预建)"
        required: true
        type: string
      home_live_url:
        description: "home 卡片 liveUrl (*.linzezhang.com); 留空则跳过 home 同步"
        required: false
        default: ""
        type: string
      home_name:
        description: "home 卡片显示名"
        required: false
        default: ""
        type: string
      home_category:
        description: "home 卡片分类"
        required: false
        default: "Cloud Service"
        type: string
      home_summary:
        description: "home 卡片一句话简介"
        required: false
        default: ""
        type: string
      home_fallback_url:
        description: "home 卡片回退链接 (通常 GitHub 源)"
        required: false
        default: ""
        type: string
      home_mode:
        description: "home 卡片视觉 mode (voyage/archive/garden)"
        required: false
        default: "voyage"
        type: string
    secrets:
      COOLIFY_BASE_URL:
        description: "Coolify API 基址, 例如 https://server.linzezhang.com"
        required: true
      COOLIFY_API_TOKEN:
        description: "Coolify API token (最小 deploy 权限)"
        required: true
      HOME_SYNC_TOKEN:
        description: "对 LinzeHomeHub 有 contents:write 的 token; 缺失则跳过 home 同步"
        required: false

permissions:
  contents: read

# 同一服务的部署串行, 不互相取消 (Coolify 部署不可并发覆盖)。
concurrency:
  group: golden-path-${{ inputs.service_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: 契约与测试占位
        env:
          SERVICE_NAME: ${{ inputs.service_name }}   # 不可信输入走 env, 不直接拼进 run (供应链/注入纪律)
        run: |
          echo "verify service=$SERVICE_NAME"
          # 各仓在此接入自身 lint/test/契约校验; 失败即阻断部署 (Gate)。

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 触发 Coolify 部署 (不可变版本)
        env:
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP: ${{ inputs.coolify_app_uuid }}
        run: |
          set -euo pipefail
          echo "触发部署: $APP"
          resp=$(curl -fsSL -X GET \
            -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/deploy?uuid=$APP&force=false")
          echo "$resp"
          echo "$resp" | grep -q deployment_uuid || { echo "部署未入队"; exit 1; }

  home-sync:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 仅当提供了 liveUrl 且配置了写 token 时才同步 home
    if: ${{ inputs.home_live_url != '' }}
    steps:
      - name: 取出 Golden Path 工具
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: LinzeColin/CodexProject
          sparse-checkout: GOLDEN_PATH/tools
          sparse-checkout-cone-mode: false
      - name: upsert home.linzezhang.com 跳转卡片
        env:
          GITHUB_TOKEN: ${{ secrets.HOME_SYNC_TOKEN }}
          SERVICE_NAME: ${{ inputs.service_name }}
          HOME_NAME: ${{ inputs.home_name }}
          HOME_CATEGORY: ${{ inputs.home_category }}
          HOME_SUMMARY: ${{ inputs.home_summary }}
          HOME_LIVE_URL: ${{ inputs.home_live_url }}
          HOME_FALLBACK_URL: ${{ inputs.home_fallback_url }}
          HOME_MODE: ${{ inputs.home_mode }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "未配置 HOME_SYNC_TOKEN, 跳过 home 同步 (非致命)"; exit 0
          fi
          python3 GOLDEN_PATH/tools/home_sync.py \
            --id "$SERVICE_NAME" \
            --name "${HOME_NAME:-$SERVICE_NAME}" \
            --category "$HOME_CATEGORY" \
            --summary "$HOME_SUMMARY" \
            --live-url "$HOME_LIVE_URL" \
            --fallback-url "$HOME_FALLBACK_URL" \
            --mode "$HOME_MODE"
