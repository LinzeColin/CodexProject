name: KMFA Dual-Plane Gate

# v1.5 双平面架构的三道门。故意红：facts/ 为空、源优先级链第 1 环未接通、
# 人类平面尚未被真实事实渲染。绿的门是假门。
#
# 隔离说明：只在双平面自身的文件（KMFA/文档/**、KMFA/machine/**）变动时触发，
# 以及手动 workflow_dispatch。Codex 正常开发的 v015 路径（KMFA/tools/**、
# KMFA/tests/**、KMFA/stage_artifacts/**、KMFA/metadata/**）不触发本工作流，
# 因此不干涉 Codex 的 CI。本工作流也不是必需检查（required check）。

on:
  workflow_dispatch:
  push:
    paths:
      - "KMFA/文档/**"
      - "KMFA/machine/**"
      - ".github/workflows/kmfa-dual-plane.yml"
  pull_request:
    paths:
      - "KMFA/文档/**"
      - "KMFA/machine/**"
      - ".github/workflows/kmfa-dual-plane.yml"

permissions:
  contents: read

concurrency:
  group: kmfa-dual-plane-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  dual-plane-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: KMFA
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # 第一道门（血缘前置门 / 渲染器）：facts/ 为空时必然红。
      # 这一步决定整个工作流红/绿。当前预期：红。
      - name: Render gate (render_human.py) —— intentionally red until facts connected
        run: python3 machine/tools/render_human.py

      # 后两道门用 if: always() 保证即使上面红也照跑，把三门状态都暴露出来。
      - name: Doc budget / Chinese / purity gate (check_doc_budget.py)
        if: always()
        run: python3 machine/tools/check_doc_budget.py

      - name: Blocker re-audit gate (check_blocker_stop.py)
        if: always()
        run: python3 machine/tools/check_blocker_stop.py
