name: OpenAIDatabase CI

on:
  push:
    branches: [main]
    paths:
      - "OpenAIDatabase/**"
      - ".github/workflows/openai-database-ci.yml"
  pull_request:
    paths:
      - "OpenAIDatabase/**"
      - ".github/workflows/openai-database-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: openai-database-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openai-database-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: OpenAIDatabase
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Required Memory Gold fast gate
        if: github.event_name == 'pull_request'
        run: python3 scripts/evaluate_memory_gold_benchmark.py --suite fast --check
      - name: Required Memory Gold full gate
        if: github.event_name != 'pull_request'
        run: python3 scripts/evaluate_memory_gold_benchmark.py --suite full --check
      - name: Required memory retrieval performance gate
        run: python3 scripts/evaluate_memory_retrieval_performance.py --check
      - name: Required memory fault reliability gate
        run: python3 scripts/evaluate_memory_fault_reliability.py --check
      - name: Required memory Automation C E2E gate
        run: python3 scripts/evaluate_memory_automation_c_e2e.py --check
      - name: Required memory snapshot recovery gate
        run: python3 scripts/evaluate_memory_snapshot_recovery.py --check
      - name: Required Portable Agent Memory V1 candidate gate
        run: python3 scripts/evaluate_memory_production_acceptance.py --phase candidate --check --reuse-current-reports
      - name: Fast governance and policy tier
        run: python3 scripts/run_verification.py --tier fast
      - name: Offline unit tier
        run: python3 scripts/run_verification.py --tier unit
      - name: Offline security tier
        run: python3 scripts/run_verification.py --tier security
      - name: Build personalization exports
        run: python3 scripts/build_personalization_exports.py --database-dir .
      - name: Route startup resources
        run: python3 scripts/route_agent_resources.py --database-dir . --intent startup
      - name: Evaluate personalization context
        run: python3 scripts/evaluate_personalization_context.py --database-dir .
      - name: Parse JSONL run logs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("data/run_logs").glob("*/*.jsonl")):
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.strip():
                      json.loads(line)
          PY
      - name: Ensure generated outputs are committed
        run: git diff --exit-code

  memory-atlas-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: OpenAIDatabase
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: OpenAIDatabase/apps/memory-atlas/package-lock.json
      - name: Compile Memory Atlas entrypoints
        run: >-
          python -m py_compile
          skills/openai-memory-analysis/scripts/openai_memory_analysis.py
          scripts/build_memory_atlas_data.py
          scripts/build_agent_context_pack.py
          scripts/sync_codex_memory_data.py
          scripts/install_codex_weekly_sync.py
          scripts/audit_memory_atlas_release.py
          scripts/audit_memory_atlas_visual_acceptance.py
          scripts/audit_memory_atlas_acceptance.py
          scripts/audit_memory_atlas_goal_completion.py
          scripts/deploy_memory_atlas_cloudflare.py
          scripts/preflight_cloudflare_pages_access.py
          scripts/install_memory_atlas_app.py
      - name: Self test memory analysis
        run: python skills/openai-memory-analysis/scripts/openai_memory_analysis.py self-test --out-dir /tmp/openai-memory-analysis-self-test
      - name: Build Memory Atlas data
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python scripts/atlasctl.py build-atlas --apply
      - name: Build Agent Context Pack
        run: python scripts/build_agent_context_pack.py --database-dir .
      - name: Build Memory Atlas frontend
        run: |
          npm ci --prefix apps/memory-atlas
          npm run build --prefix apps/memory-atlas
      - name: Local integration tier
        run: python3 scripts/run_verification.py --tier integration
      - name: Aggregate release, visual, acceptance and preflight gates
        run: python scripts/atlasctl.py audit --check goal-completion --publish-dir apps/memory-atlas/dist
