name: Agent Loop - Validate Approved Task Pack

on:
  workflow_dispatch:
    inputs:
      taskpack:
        description: Approved dual-plane Task Pack to validate; this workflow never publishes it
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-loop-taskpack-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate-taskpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TASKPACK_INPUT: ${{ inputs.taskpack }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted validator only
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate without creating Issue, branch, PR, or merge
        run: |
          taskpack_path="${RUNNER_TEMP}/approved-taskpack.md"
          python3 - "${taskpack_path}" <<'PY'
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(os.environ["TASKPACK_INPUT"], encoding="utf-8")
          PY
          python3 -B scripts/agent_loop/validate_taskpack.py --taskpack "${taskpack_path}"
          {
            echo "## Agent Loop Task Pack Validation"
            echo "- result: PASS"
            echo "- mutation: none"
            echo "- publisher: external authenticated publisher only"
          } >> "${GITHUB_STEP_SUMMARY}"
