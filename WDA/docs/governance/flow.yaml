    priority: P3
    note: >-
      休眠项目。治理入口已建好,产品本身一行运行代码都没有。
      当前任务 WDA-STAGE0-P1,状态 definition_pending。
    cells:
      define:
        state: not_built
        evidence: "STATUS.md 原文「Product scope: not defined」,当前阶段 WDA-STAGE0-P1"
      build:
        state: not_built
        evidence: "STATUS.md 原文「Runtime code: none」"
      verify:
        state: not_built
        evidence: "没有实现,无从验证;STATUS.md「Production readiness: not applicable」"
