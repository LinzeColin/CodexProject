# 来源：P0.5「Signal-Lattice 日志洪水」，2026-09-30。
# 仓库副本：CodexProject/OPERATIONS/host-etc/systemd/journald.conf.d/50-linze-size-cap.conf（仓是源，主机是部署产物）
#
# 为什么：signal-lattice once 每分钟把约 0.7 MB 的整份报告打到 stdout，
# journal 涨到 4.0 GB 却只能回溯 2 天，同机其它服务的失败证据被冲掉。
# 洪水源头已在 Signal-Lattice 0.0.0.3.5 修掉（只在结论变化时记一行）；这里是兜底上限，
# 防止以后任何一个服务再把 journal 撑爆。全局上限，不针对任何单个服务。
[Journal]
SystemMaxUse=1G
